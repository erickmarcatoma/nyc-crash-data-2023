<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Crash Data 2023</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 1.75rem;
    }
    .chart-box {
      position: relative;
      margin-top: 1.5rem;
    }
    #error-msg {
      color: #ef4444;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>2023 NYC Motor Vehicle Collisions: Primary Contributing Factors</h1>
    <p>Live aggregates queried directly from NYC Open Data (SODA API).</p>
    
    <div id="error-msg"></div>
    
    <div class="chart-box">
      <canvas id="crashChart"></canvas>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
